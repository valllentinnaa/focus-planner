project_id = "focus-planner"

# Local ports are offset from the defaults so this stack can run next to other Supabase projects.
[api]
enabled = true
port = 55321
schemas = ["public"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
port = 55329

[studio]
port = 55323

[local_smtp]
port = 55324

[analytics]
port = 55327

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["focusplanner://auth/callback", "http://localhost:8081/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

[auth.rate_limit]
email_sent = 10
token_verifications = 30

# OAuth callback from Google arrives without a Supabase JWT; the function verifies the user itself
# (bearer token on every API action, signed `state` on the callback).
[functions.google-calendar]
verify_jwt = false

# Called by the iPhone Shortcut with the user's share key (not a Supabase sign-in); the function
# checks the key itself.
[functions.share-in]
verify_jwt = false
