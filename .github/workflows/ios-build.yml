name: iOS build (TestFlight)

# Manual trigger. Produces an iOS build on EAS and (optionally) submits it to TestFlight.
# Requires:
#   - An Apple Developer account (Apple Developer Program membership).
#   - A GitHub Actions secret EXPO_TOKEN (Expo access token: https://expo.dev/settings/access-tokens).
#   - First-time credential + App Store Connect app setup done once locally (see RELEASING_IOS.md).

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        default: "preview"
        type: choice
        options: [preview, production]
      submit:
        description: "Submit to TestFlight after build (production only)"
        default: false
        type: boolean

jobs:
  ios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build iOS
        run: eas build --platform ios --profile ${{ inputs.profile }} --non-interactive --wait
      - name: Submit to TestFlight
        if: ${{ inputs.submit && inputs.profile == 'production' }}
        run: eas submit --platform ios --profile production --latest --non-interactive
